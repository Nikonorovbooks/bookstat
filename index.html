<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой читательский дневник</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f1ea; --card: #fff; --text: #2c2c2c; --muted: #8a8577;
    --accent: #b8860b; --accent-hover: #9a6f09; --border: #e5e0d5;
    --danger: #c0392b; --success: #27ae60;
  }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 24px 16px 60px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 32px; font-weight: normal; letter-spacing: 1px; margin-bottom: 6px; }
  header p { color: var(--muted); font-style: italic; font-size: 15px; }

  /* ===== Блок статистики ===== */
  .stats-panel {
    background: var(--card); border-radius: 14px; padding: 20px 22px;
    margin-bottom: 26px; box-shadow: 0 4px 18px rgba(0,0,0,0.06);
  }
  .stats-panel h2 {
    font-size: 18px; font-weight: normal; margin-bottom: 16px;
    color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px;
  }
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .stat-box {
    background: #faf8f4; border-radius: 10px; padding: 14px; text-align: center;
  }
  .stat-box .num { font-size: 26px; font-weight: bold; color: var(--accent); line-height: 1.1; }
  .stat-box .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: -apple-system, sans-serif; }
  .genres-title {
    font-size: 13px; color: var(--muted); margin-bottom: 8px;
    font-family: -apple-system, sans-serif; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .genre-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 14px;
  }
  .genre-name { min-width: 120px; }
  .genre-bar-wrap { flex: 1; height: 14px; background: var(--border); border-radius: 7px; overflow: hidden; }
  .genre-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #d4a017); border-radius: 7px; }
  .genre-count { min-width: 70px; text-align: right; font-size: 13px; color: var(--muted); }
  .no-stats { color: var(--muted); font-style: italic; font-size: 14px; }

  .toolbar { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .btn {
    font-family: inherit; font-size: 15px; padding: 11px 22px; border: none;
    border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.97); }
  .btn.secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .btn.secondary:hover { background: rgba(184,134,11,0.08); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
  .book-card {
    background: var(--card); border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08); display: flex; flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s; position: relative;
  }
  .book-card:hover { transform: translateY(-3px); box-shadow: 0 8px 26px rgba(0,0,0,0.12); }
  .cover {
    width: 100%; height: 320px; background: #ddd8cc; display: flex;
    align-items: center; justify-content: center; color: var(--muted);
    font-size: 13px; overflow: hidden; position: relative;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover .placeholder { font-style: italic; text-align: center; padding: 20px; }

  .card-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-body h2 { font-size: 18px; font-weight: normal; line-height: 1.3; }
  .author { color: var(--muted); font-size: 14px; font-style: italic; }
  .genre-tag {
    display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 12px;
    background: rgba(184,134,11,0.12); color: var(--accent);
    font-family: -apple-system, sans-serif; align-self: flex-start;
  }
  .meta { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
  .meta span { display: block; }

  .rating { font-size: 16px; letter-spacing: 1px; color: var(--accent); margin-top: 2px; }
  .rating .empty-star { color: #ddd8cc; }

  .progress-wrap { margin-top: 12px; margin-bottom: 4px; }
  .progress-bar { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #d4a017); border-radius: 5px; transition: width 0.4s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; }
  .progress-label .pages { font-weight: bold; color: var(--text); }

  .status-badge {
    position: absolute; top: 10px; right: 10px; padding: 4px 10px;
    border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase;
    letter-spacing: 0.5px; color: #fff; font-family: -apple-system, sans-serif;
  }
  .status-reading { background: var(--accent); }
  .status-finished { background: var(--success); }
  .status-planned { background: #7f8c8d; }

  .card-actions { display: flex; gap: 8px; padding: 0 16px 16px; }
  .card-actions .btn { flex: 1; padding: 8px; font-size: 13px; border-radius: 6px; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: rgba(192,57,43,0.08); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .overlay.active { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px; width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto; padding: 26px; animation: pop 0.2s ease;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .modal h2 { font-size: 22px; font-weight: normal; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-family: -apple-system, sans-serif; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-family: inherit; font-size: 15px; background: #faf8f4;
    outline: none; transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Звёзды в форме */
  .star-input { display: flex; gap: 4px; font-size: 30px; cursor: pointer; user-select: none; }
  .star-input span { color: #ddd8cc; transition: color 0.15s; line-height: 1; }
  .star-input span.active { color: var(--accent); }

  .file-drop {
    border: 2px dashed var(--border); border-radius: 8px; padding: 16px;
    text-align: center; font-size: 13px; color: var(--muted); cursor: pointer;
    transition: border-color 0.2s, background 0.2s; font-family: -apple-system, sans-serif;
  }
  .file-drop:hover { border-color: var(--accent); background: rgba(184,134,11,0.04); }
  .file-drop img { max-height: 120px; margin-top: 10px; border-radius: 6px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .modal-actions .btn { flex: 1; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-style: italic; }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; font-style: normal; }

  @media (max-width: 600px) {
    header h1 { font-size: 24px; }
    .cover { height: 260px; }
    .field-row { grid-template-columns: 1fr; }
    .genre-name { min-width: 90px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 Мой читательский дневник</h1>
    <p>Что читаю, сколько прочитано, когда начал</p>
  </header>

  <!-- Блок статистики -->
  <div class="stats-panel">
    <h2>📊 Статистика</h2>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="genres-title">По жанрам (прочитано страниц)</div>
    <div id="genresBlock"></div>
  </div>

  <div class="toolbar">
    <button class="btn" onclick="openModal()">+ Добавить книгу</button>
    <button class="btn secondary" onclick="exportData()">Экспорт</button>
    <button class="btn secondary" onclick="document.getElementById('importFile').click()">Импорт</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>

  <div id="grid" class="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Новая книга</h2>
    <input type="hidden" id="editId">

    <div class="field">
      <label>Название *</label>
      <input type="text" id="fTitle" placeholder="Война и мир">
    </div>
    <div class="field">
      <label>Автор</label>
      <input type="text" id="fAuthor" placeholder="Лев Толстой">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Издание / издательство</label>
        <input type="text" id="fPublisher" placeholder="АСТ, 2020">
      </div>
      <div class="field">
        <label>Жанр</label>
        <input type="text" id="fGenre" placeholder="Роман, фантастика..." list="genreList">
        <datalist id="genreList">
          <option value="Роман"></option>
          <option value="Фантастика"></option>
          <option value="Фэнтези"></option>
          <option value="Детектив"></option>
          <option value="Нон-фикшн"></option>
          <option value="Биография"></option>
          <option value="Поэзия"></option>
          <option value="Классика"></option>
          <option value="Ужасы"></option>
          <option value="Приключения"></option>
        </datalist>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Всего страниц *</label>
        <input type="number" id="fTotalPages" min="1" placeholder="1200">
      </div>
      <div class="field">
        <label>Прочитано страниц</label>
        <input type="number" id="fReadPages" min="0" placeholder="350">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Дата начала чтения</label>
        <input type="date" id="fStartDate">
      </div>
      <div class="field">
        <label>Дата завершения</label>
        <input type="date" id="fEndDate">
      </div>
    </div>
    <div class="field">
      <label>Статус</label>
      <select id="fStatus">
        <option value="planned">📌 В планах</option>
        <option value="reading" selected>📖 Читаю</option>
        <option value="finished">✅ Прочитано</option>
      </select>
    </div>
    <div class="field">
      <label>Оценка</label>
      <div class="star-input" id="starInput">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span>
        <span data-v="4">★</span><span data-v="5">★</span>
      </div>
      <input type="hidden" id="fRating" value="0">
    </div>
    <div class="field">
      <label>Обложка (загрузить картинку)</label>
      <div class="file-drop" onclick="document.getElementById('fCover').click()">
        Нажмите, чтобы выбрать изображение
        <div id="coverPreview"></div>
      </div>
      <input type="file" id="fCover" accept="image/*" style="display:none" onchange="previewCover(event)">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="saveBook()">Сохранить</button>
    </div>
  </div>
</div>

<script>
/* ===== IndexedDB для обложек ===== */
let db;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('readerDiary', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('covers')) d.createObjectStore('covers');
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}
function saveCover(id, dataUrl) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('covers', 'readwrite');
    tx.objectStore('covers').put(dataUrl, id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}
function getCover(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('covers', 'readonly');
    const req = tx.objectStore('covers').get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = e => reject(e.target.error);
  });
}
function deleteCover(id) {
  const tx = db.transaction('covers', 'readwrite');
  tx.objectStore('covers').delete(id);
}

/* ===== Данные ===== */
let books = JSON.parse(localStorage.getItem('books') || '[]');
let pendingCover = null;

function saveBooks() { localStorage.setItem('books', JSON.stringify(books)); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function formatDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${day}.${m}.${y}`;
}
function renderStars(rating) {
  const r = Number(rating) || 0;
  let s = '';
  for (let i = 1; i <= 5; i++) {
    s += i <= r ? '★' : '<span class="empty-star">★</span>';
  }
  return s;
}

/* ===== Статистика ===== */
function updateStats() {
  const now = new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

  // Периоды: неделя (с пн), месяц, год
  const dayOfWeek = (now.getDay() + 6) % 7; // 0 = Пн
  const weekStart = startOfDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek));
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const yearStart = new Date(now.getFullYear(), 0, 1);

  let totalPages = 0, weekPages = 0, monthPages = 0, yearPages = 0;
  let finishedCount = 0;
  const genreMap = {};

  for (const b of books) {
    const read = Number(b.readPages) || 0;
    const total = Number(b.totalPages) || 0;
    totalPages += read;
    if (b.status === 'finished') finishedCount++;

    // Для статистики по периодам берём дату завершения, иначе — начала
    const refDate = b.endDate ? new Date(b.endDate) : (b.startDate ? new Date(b.startDate) : null);
    if (refDate && read > 0) {
      if (refDate >= weekStart) weekPages += read;
      if (refDate >= monthStart) monthPages += read;
      if (refDate >= yearStart) yearPages += read;
    }

    // Жанры — только по прочитанным страницам
    if (read > 0) {
      const g = (b.genre || 'Без жанра').trim();
      genreMap[g] = (genreMap[g] || 0) + read;
    }
  }

  const statsGrid = document.getElementById('statsGrid');
  statsGrid.innerHTML = `
    <div class="stat-box"><div class="num">${totalPages.toLocaleString('ru')}</div><div class="lbl">Всего страниц прочитано</div></div>
    <div class="stat-box"><div class="num">${weekPages.toLocaleString('ru')}</div><div class="lbl">За эту неделю</div></div>
    <div class="stat-box"><div class="num">${monthPages.toLocaleString('ru')}</div><div class="lbl">За этот месяц</div></div>
    <div class="stat-box"><div class="num">${yearPages.toLocaleString('ru')}</div><div class="lbl">За этот год</div></div>
    <div class="stat-box"><div class="num">${finishedCount}</div><div class="lbl">Книг прочитано</div></div>
  `;

  const genresBlock = document.getElementById('genresBlock');
  const entries = Object.entries(genreMap).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) {
    genresBlock.innerHTML = '<div class="no-stats">Пока нет данных — добавьте книги и укажите прочитанные страницы.</div>';
    return;
  }
  const max = entries[0][1];
  genresBlock.innerHTML = entries.map(([g, n]) => `
    <div class="genre-row">
      <div class="genre-name">${escapeHtml(g)}</div>
      <div class="genre-bar-wrap"><div class="genre-bar" style="width:${Math.round(n/max*100)}%"></div></div>
      <div class="genre-count">${n.toLocaleString('ru')} стр.</div>
    </div>
  `).join('');
}

/* ===== Отрисовка карточек ===== */
async function render() {
  updateStats();
  const grid = document.getElementById('grid');

  if (books.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="big">📖</div>
      Пока пусто. Нажмите «+ Добавить книгу», чтобы начать!
    </div>`;
    return;
  }

  const order = { reading: 0, planned: 1, finished: 2 };
  const sorted = [...books].sort((a, b) => order[a.status] - order[b.status]);

  const cards = [];
  for (const b of sorted) {
    const cover = await getCover(b.id);
    const total = Number(b.totalPages) || 0;
    const read = Number(b.readPages) || 0;
    const pct = total > 0 ? Math.min(100, Math.round(read / total * 100)) : 0;
    const statusLabel = { reading: 'Читаю', planned: 'В планах', finished: 'Прочитано' }[b.status] || '';
    const ratingHtml = b.rating ? `<div class="rating">${renderStars(b.rating)}</div>` : '';

    cards.push(`
      <div class="book-card">
        <div class="cover">
          ${cover ? `<img src="${cover}" alt="Обложка">` : `<div class="placeholder">Нет обложки</div>`}
        </div>
        <span class="status-badge status-${b.status}">${statusLabel}</span>
        <div class="card-body">
          <h2>${escapeHtml(b.title)}</h2>
          ${b.author ? `<div class="author">${escapeHtml(b.author)}</div>` : ''}
          ${b.genre ? `<div class="genre-tag">${escapeHtml(b.genre)}</div>` : ''}
          ${ratingHtml}
          <div class="meta">
            ${b.publisher ? `<span>Издание: ${escapeHtml(b.publisher)}</span>` : ''}
            ${b.startDate ? `<span>Начало: ${formatDate(b.startDate)}</span>` : ''}
            ${b.endDate ? `<span>Завершено: ${formatDate(b.endDate)}</span>` : ''}
            ${total ? `<span>Всего страниц: ${total}</span>` : ''}
          </div>
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label">
              <span class="pages">${read} / ${total} стр.</span>
              <span>${pct}%</span>
            </div>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn secondary" onclick="openModal('${b.id}')">Изменить</button>
          <button class="btn btn-danger" onclick="removeBook('${b.id}')">Удалить</button>
        </div>
      </div>
    `);
  }
  grid.innerHTML = cards.join('');
}

/* ===== Звёзды в форме ===== */
function setRating(v) {
  document.getElementById('fRating').value = v;
  document.querySelectorAll('#starInput span').forEach((s, i) => {
    s.classList.toggle('active', i < v);
  });
}
document.querySelectorAll('#starInput span').forEach(s => {
  s.addEventListener('click', () => {
    const v = Number(s.dataset.v);
    setRating(v === Number(document.getElementById('fRating').value) ? 0 : v);
  });
});

/* ===== Модалка ===== */
function openModal(id) {
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('modalTitle');
  const coverPreview = document.getElementById('coverPreview');
  pendingCover = null;
  coverPreview.innerHTML = '';

  if (id) {
    const b = books.find(x => x.id === id);
    if (!b) return;
    titleEl.textContent = 'Редактировать книгу';
    document.getElementById('editId').value = id;
    document.getElementById('fTitle').value = b.title || '';
    document.getElementById('fAuthor').value = b.author || '';
    document.getElementById('fPublisher').value = b.publisher || '';
    document.getElementById('fGenre').value = b.genre || '';
    document.getElementById('fTotalPages').value = b.totalPages || '';
    document.getElementById('fReadPages').value = b.readPages || 0;
    document.getElementById('fStartDate').value = b.startDate || '';
    document.getElementById('fEndDate').value = b.endDate || '';
    document.getElementById('fStatus').value = b.status || 'reading';
    setRating(Number(b.rating) || 0);
    getCover(id).then(src => {
      if (src) {
        pendingCover = src;
        coverPreview.innerHTML = `<img src="${src}" alt="Обложка">`;
      }
    });
  } else {
    titleEl.textContent = 'Новая книга';
    document.getElementById('editId').value = '';
    document.getElementById('fTitle').value = '';
    document.getElementById('fAuthor').value = '';
    document.getElementById('fPublisher').value = '';
    document.getElementById('fGenre').value = '';
    document.getElementById('fTotalPages').value = '';
    document.getElementById('fReadPages').value = '';
    document.getElementById('fStartDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('fEndDate').value = '';
    document.getElementById('fStatus').value = 'reading';
    setRating(0);
  }
  overlay.classList.add('active');
  document.getElementById('fTitle').focus();
}
function closeModal() {
  document.getElementById('overlay').classList.remove('active');
  pendingCover = null;
}

/* ===== Обложка ===== */
function previewCover(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert('Файл слишком большой (макс. 5 МБ)'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    pendingCover = ev.target.result;
    document.getElementById('coverPreview').innerHTML = `<img src="${pendingCover}" alt="Обложка">`;
  };
  reader.readAsDataURL(file);
}

/* ===== Сохранение ===== */
async function saveBook() {
  const id = document.getElementById('editId').value;
  const title = document.getElementById('fTitle').value.trim();
  const totalPages = Number(document.getElementById('fTotalPages').value);
  const readPages = Number(document.getElementById('fReadPages').value) || 0;
  const status = document.getElementById('fStatus').value;

  if (!title) return alert('Введите название');
  if (!totalPages || totalPages < 1) return alert('Укажите количество страниц');
  if (readPages > totalPages) return alert('Прочитано не может быть больше, чем всего страниц');

  const data = {
    id: id || String(Date.now()),
    title,
    author: document.getElementById('fAuthor').value.trim(),
    publisher: document.getElementById('fPublisher').value.trim(),
    genre: document.getElementById('fGenre').value.trim(),
    totalPages,
    readPages,
    startDate: document.getElementById('fStartDate').value,
    endDate: document.getElementById('fEndDate').value,
    status,
    rating: Number(document.getElementById('fRating').value) || 0,
  };

  if (id) {
    const idx = books.findIndex(x => x.id === id);
    books[idx] = data;
  } else {
    books.push(data);
  }
  saveBooks();

  if (pendingCover) await saveCover(data.id, pendingCover);
  closeModal();
  render();
}

/* ===== Удаление ===== */
function removeBook(id) {
  if (!confirm('Удалить книгу из дневника?')) return;
  books = books.filter(b => b.id !== id);
  saveBooks();
  deleteCover(id);
  render();
}

/* ===== Экспорт / Импорт ===== */
async function exportData() {
  const pack = [];
  for (const b of books) {
    const cover = await getCover(b.id);
    pack.push({ ...b, cover });
  }
  const blob = new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `reader-diary-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
async function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  try {
    const pack = JSON.parse(text);
    if (!Array.isArray(pack)) throw new Error('Неверный формат');
    if (!confirm(`Импортировать ${pack.length} книг? Текущие данные будут заменены.`)) return;
    books = pack.map(({ cover, ...rest }) => rest);
    saveBooks();
    for (const item of pack) if (item.cover) await saveCover(item.id, item.cover);
    render();
  } catch (err) {
    alert('Ошибка импорта: ' + err.message);
  }
  e.target.value = '';
}

/* ===== Закрытие ===== */
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ===== Старт ===== */
openDB().then(render).catch(err => {
  console.error(err);
  alert('Не удалось открыть хранилище браузера');
});
</script>
